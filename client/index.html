<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickChat - A modern real-time chat application for instant messaging with friends" />
    <meta name="keywords" content="chat, messaging, real-time, communication, social" />
    <meta name="author" content="Akshat" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="QuickChat" />
    <meta property="og:description" content="A modern real-time chat application for instant messaging with friends" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:image" content="https://your-domain.com/bgImage.svg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuickChat" />
    <meta name="twitter:description" content="A modern real-time chat application for instant messaging with friends" />
    <meta name="twitter:image" content="https://your-domain.com/bgImage.svg" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <title>QuickChat - Real-time Chat Application</title>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/bgImage.svg" as="image" />
    <link rel="preload" href="/favicon.svg" as="image" />
    <link rel="preconnect" href="http://localhost:5000" />
    
    <!-- PWA Manifest (optional but recommended) -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Fallback for browsers with JavaScript disabled -->
    <noscript>
      <div style="text-align: center; padding: 2rem; font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white;">
        <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 2rem; border-radius: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.1);">
          <h2 style="margin-bottom: 1rem; font-size: 2rem;">⚡ QuickChat</h2>
          <p style="font-size: 1.1rem; opacity: 0.9;">JavaScript is required to run this application.</p>
          <p style="font-size: 0.9rem; margin-top: 1rem; opacity: 0.7;">Please enable JavaScript in your browser settings to continue.</p>
        </div>
      </div>
    </noscript>
    
    <!-- Scripts -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
